<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- Rounded Squircle Backdrop -->
  <rect width="48" height="48" rx="14" fill="#FFF1F2" stroke="#FECDD3" stroke-width="2"/>

  <!-- Left Ring: Warm Gold (#D4AF37) -->
  <circle cx="20" cy="27" r="9.5" stroke="#D4AF37" stroke-width="3.2"/>

  <!-- Diamond Gem on Rose Ring -->
  <path d="M28 8.5L31.5 12L28 15.5L24.5 12Z" fill="#E11D48"/>
  <circle cx="28" cy="12" r="1.2" fill="#FFFFFF"/>

  <!-- Right Ring: Rose (#E11D48) -->
