  <!-- Interlocking Bridge Arc (Gold over Rose at top intersection) -->
  <path d="M23 18C24.5 18.5 25.8 19.5 26.8 20.8" stroke="#D4AF37" stroke-width="3.2" stroke-linecap="round"/>
</svg>