<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="#FBFBFA"/>

  <!-- Decorative Warm Ambient Glows -->
  <circle cx="1050" cy="120" r="280" fill="#FFF1F2" opacity="0.8"/>
  <circle cx="150" cy="500" r="220" fill="#FEF3C7" opacity="0.5"/>
  <circle cx="950" cy="520" r="180" fill="#FCE7F3" opacity="0.6"/>

  <!-- Outer Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="32" stroke="#E2E8F0" stroke-width="2" fill="none"/>

  <!-- Brand Mark Icon Box (x=80, y=80) -->
  <rect x="80" y="80" width="68" height="68" rx="20" fill="#FFF1F2" stroke="#FFE4E6" stroke-width="2"/>
  <!-- Heart Handshake Path Icon -->
  <g transform="translate(98, 98) scale(1.3)" stroke="#E11D48" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
  </g>

  <!-- Brand Typography -->
  <text x="164" y="125" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#0F172A" letter-spacing="-1">
    Wedding<tspan fill="#E11D48">Plan</tspan>
  </text>
  <text x="166" y="145" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#94A3B8" letter-spacing="1">
    SMART WEDDING BUDGETING &amp; PLANNER
  </text>

  <!-- Tag Pill Top Right -->
  <rect x="850" y="88" width="270" height="42" rx="21" fill="#FFF1F2" stroke="#FECDD3" stroke-width="1.5"/>
  <text x="985" y="115" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#E11D48" text-anchor="middle">
    💍 100% GRATIS &amp; MANDIRI
  </text>

  <!-- Main Headline -->
  <text x="80" y="245" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#0F172A" letter-spacing="-1.5">
    Rencanakan Pernikahan Impian
  </text>
  <text x="80" y="315" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#E11D48" letter-spacing="-1.5">
    Tanpa Stres <tspan fill="#0F172A">&amp; Bebas Overbudget</tspan>
  </text>

  <!-- Sub-Headline -->
  <text x="80" y="375" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" fill="#475569">
    Satu aplikasi lengkap untuk kelola anggaran, checklist berkas KUA,
  </text>
  <text x="80" y="410" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" fill="#475569">
    seserahan adat nusantara, rundown hari-H, dan undangan digital.
  </text>

  <!-- Feature Highlights Row -->
  <g transform="translate(80, 460)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="310" height="54" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="28" cy="27" r="14" fill="#ECFDF5"/>
    <text x="28" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" text-anchor="middle">💰</text>
    <text x="52" y="33" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#1E293B">
      Budgeting &amp; Export PDF/Excel
    </text>

    <!-- Pill 2 -->
    <rect x="325" y="0" width="290" height="54" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="353" cy="27" r="14" fill="#FEF3C7"/>
    <text x="353" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" text-anchor="middle">📋</text>
    <text x="377" y="33" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#1E293B">
      30+ Checklist Berkas KUA
    </text>

    <!-- Pill 3 -->
    <rect x="630" y="0" width="300" height="54" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="658" cy="27" r="14" fill="#F3E8FF"/>
    <text x="658" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" text-anchor="middle">🎁</text>
    <text x="682" y="33" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#1E293B">
      20+ Template Adat Nusantara
    </text>
  </g>

  <!-- Footer URL / Badge -->
  <line x1="80" y1="545" x2="1120" y2="545" stroke="#F1F5F9" stroke-width="1.5"/>
  <text x="80" y="578" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#E11D48">
    https://weddingplan.id
  </text>
  <text x="1120" y="578" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#94A3B8" text-anchor="end">
    Didesain untuk pernikahan bahagia di Indonesia 🇮🇩
  </text>
</svg>
